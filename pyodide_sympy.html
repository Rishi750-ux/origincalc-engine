<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
</head>
<body>
<script type="text/javascript">
let pyodide = null;
window.sympyReady = false;

window.initSymPy = async function() {
    if (pyodide) return;
    
    console.log('Loading Pyodide...');
    pyodide = await loadPyodide();
    
    console.log('Loading SymPy...');
    await pyodide.loadPackage('sympy');
    
    console.log('SymPy loaded!');
    window.sympyReady = true;
};

window.evaluateExpression = function(expr, xMin, xMax, numPoints) {
    if (!pyodide) return [];
    
    const code = `
import sympy as sp
import numpy as np
x = sp.Symbol('x')
expr = sp.sympify("${expr}")
x_vals = np.linspace(${xMin}, ${xMax}, ${numPoints})
points = []
for x_val in x_vals:
    try:
        y_val = float(expr.subs(x, x_val))
        points.append([float(x_val), y_val])
    except:
        pass
points
`;
    return pyodide.runPython(code).toJs();
};

window.solveEquation = function(equation) {
    if (!pyodide) return [];
    
    const code = `
import sympy as sp
x = sp.Symbol('x')
lhs, rhs = "${equation}".split("=")
eq = sp.sympify(lhs) - sp.sympify(rhs)
sols = sp.solve(eq, x)
[str(s) for s in sols]
`;
    return pyodide.runPython(code).toJs();
};
</script>
</body>
</html>
